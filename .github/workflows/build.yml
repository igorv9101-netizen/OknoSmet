name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer
      run: |
        pip install buildozer cython

    - name: Accept Android licenses
      run: |
        mkdir -p $HOME/.android
        echo "24333f8a63b6825ea9c5514f6c6846f5ab9c4b4c" > $HOME/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OknoSmet-APK
        path: bin/*.apk
